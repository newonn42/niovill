<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관리자</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E6A4C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin">
<div class="wrap" style="padding-bottom: 24px">

  <header class="top">
    <a class="brand" href="/admin/">
      <b>관리자</b>
      <small id="whoami">&nbsp;</small>
    </a>
    <a class="chip-link" href="/" target="_blank" rel="noopener">홈페이지 보기</a>
  </header>

  <p class="a-msg" id="loading">불러오는 중…</p>

  <!-- 처음 설정 -->
  <section class="a-card a-auth" id="viewSetup" hidden>
    <h1>관리자 만들기</h1>
    <p class="help">처음 한 번만 나오는 화면입니다. 여기서 만든 아이디로 앞으로 로그인합니다.</p>
    <form id="setupForm" novalidate>
      <div class="field"><label for="sName">이름</label><input id="sName" maxlength="20" autocomplete="name" placeholder="홍길동"></div>
      <div class="field"><label for="sUser">아이디</label><input id="sUser" maxlength="20" autocapitalize="off" autocomplete="username" placeholder="영문 소문자·숫자 3~20자"></div>
      <div class="field"><label for="sPass">비밀번호</label><input id="sPass" type="password" maxlength="72" autocomplete="new-password" placeholder="8자 이상"></div>
      <p class="error" role="alert" hidden></p>
      <button class="btn submit" type="submit">관리자 만들기</button>
    </form>
  </section>

  <!-- 로그인 -->
  <section class="a-card a-auth" id="viewLogin" hidden>
    <h1>로그인</h1>
    <form id="loginForm" novalidate>
      <div class="field"><label for="lUser">아이디</label><input id="lUser" maxlength="20" autocapitalize="off" autocomplete="username"></div>
      <div class="field"><label for="lPass">비밀번호</label><input id="lPass" type="password" maxlength="72" autocomplete="current-password"></div>
      <p class="error" role="alert" hidden></p>
      <button class="btn submit" type="submit">로그인</button>
      <p class="fine">한 번 로그인하면 30일 동안 유지됩니다</p>
    </form>
  </section>

  <!-- 로그인 후 -->
  <div id="viewMain" hidden>
    <nav class="a-tabs" role="tablist">
      <button type="button" role="tab" data-tab="inbox" aria-selected="true">신청함 <span class="a-badge" id="newBadge" hidden></span></button>
      <button type="button" role="tab" data-tab="status" aria-selected="false">모집 상태</button>
      <button type="button" role="tab" data-tab="settings" aria-selected="false">계정</button>
    </nav>

    <!-- 신청함 탭 -->
    <div id="tabInbox">
      <div class="a-filter" role="group" aria-label="신청 구분">
        <button type="button" data-filter="new" aria-pressed="true">새 신청 <b id="cntNew">0</b></button>
        <button type="button" data-filter="contacted" aria-pressed="false">연락함 <b id="cntContacted">0</b></button>
        <button type="button" data-filter="done" aria-pressed="false">완료 <b id="cntDone">0</b></button>
      </div>
      <p class="error" id="inboxError" role="alert" hidden></p>
      <div id="inboxList" class="a-inbox"></div>
      <p class="a-msg" id="inboxEmpty" hidden></p>
      <p class="help a-pad">완료 처리 후 <b>90일</b>이 지나면 자동으로 삭제됩니다.</p>
    </div>

    <!-- 모집 상태 탭 -->
    <div id="tabStatus" hidden>
      <section class="a-card">
        <h2>홈페이지 모집 상태</h2>
        <p class="help">평소에는 <b>모집 중</b>으로 두세요. 오래 만실일 때만 <b>만실</b>로 바꾸면 홈 문구가 "현재 만실 · 대기 신청"으로 바뀝니다. 신청서는 두 경우 모두 받습니다.</p>
        <div class="a-switch" role="group" aria-label="모집 상태">
          <button type="button" data-full="0">모집 중</button>
          <button type="button" data-full="1">만실</button>
        </div>
        <p class="error" id="statusError" role="alert" hidden></p>
        <p class="a-last" id="lastChange"></p>
      </section>
    </div>

    <!-- 계정 탭 -->
    <div id="tabSettings" hidden>
      <section class="a-card">
        <h2>관리자 계정</h2>
        <ul class="a-list" id="adminList"></ul>
        <details>
          <summary class="a-link">관리자 추가</summary>
          <form id="adminForm" novalidate>
            <div class="field"><label for="aName">이름</label><input id="aName" maxlength="20"></div>
            <div class="field"><label for="aUser">아이디</label><input id="aUser" maxlength="20" autocapitalize="off" placeholder="영문 소문자·숫자 3~20자"></div>
            <div class="field"><label for="aPass">처음 비밀번호</label><input id="aPass" type="password" maxlength="72" autocomplete="new-password" placeholder="8자 이상 · 본인이 나중에 변경"></div>
            <p class="error" role="alert" hidden></p>
            <p class="a-ok" hidden></p>
            <button class="btn" type="submit">추가하기</button>
          </form>
        </details>
      </section>

      <section class="a-card">
        <h2>내 비밀번호 변경</h2>
        <form id="pwForm" novalidate>
          <div class="field"><label for="pCur">지금 비밀번호</label><input id="pCur" type="password" maxlength="72" autocomplete="current-password"></div>
          <div class="field"><label for="pNew">새 비밀번호</label><input id="pNew" type="password" maxlength="72" autocomplete="new-password" placeholder="8자 이상"></div>
          <p class="error" role="alert" hidden></p>
          <p class="a-ok" hidden></p>
          <button class="btn ghost" type="submit">변경하기</button>
        </form>
      </section>

      <button type="button" class="btn ghost a-logout" id="logoutBtn">로그아웃</button>
    </div>
  </div>
</div>

<script src="/admin/admin.js" defer></script>
</body>
</html>
