<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상담 신청 | 니오빌 원룸텔</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E6A4C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap" style="padding-bottom: 0">

  <header class="page-head">
    <a class="back" href="/" aria-label="홈으로">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>빈방 확인 · 상담 신청</h1>
  </header>

  <form class="form" id="applyForm" novalidate>
    <p class="help">빈방이 있으면 바로, 없으면 <b>대기 순서대로</b> 연락드립니다. 방보기를 원하시면 문의 칸에 적어주세요.</p>

    <div class="field">
      <label for="name">이름 <span class="req">*</span></label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="30" placeholder="홍길동" required>
    </div>
    <div class="field">
      <label for="phone">연락처 <span class="req">*</span></label>
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="010-0000-0000" required>
    </div>
    <div class="two">
      <div class="field">
        <label for="roomType">희망 타입</label>
        <select id="roomType" name="roomType">
          <option value="any">상관없음</option>
          <option value="premium">프리미엄 외창</option>
          <option value="outer">외창</option>
          <option value="inner">내창</option>
        </select>
      </div>
      <div class="field">
        <label for="date">입실 희망일 <span class="opt">(선택)</span></label>
        <input id="date" name="date" type="date">
      </div>
    </div>
    <div class="field">
      <label for="period">거주 기간 <span class="opt">(선택)</span></label>
      <select id="period" name="period">
        <option value="">선택 안 함</option>
        <option value="1-2m">1~2개월</option>
        <option value="3-6m">3~6개월</option>
        <option value="6m+">6개월 이상</option>
      </select>
    </div>
    <div class="field">
      <label for="message">문의 <span class="opt">(선택)</span></label>
      <textarea id="message" name="message" maxlength="500" placeholder="예: 방보기 원해요 / 주차 되나요?"></textarea>
    </div>

    <label class="agree">
      <input type="checkbox" id="agree" name="agree" required>
      <span><b>[필수]</b> 개인정보 수집·이용 및 국외 이전에 동의합니다. <a href="/privacy.html" target="_blank">내용 보기</a></span>
    </label>

    <div class="hp" aria-hidden="true">
      <label for="website">비워 두세요</label>
      <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <p class="error" id="formError" role="alert" hidden></p>

    <button class="btn submit" type="submit" id="submitBtn">상담 신청하기</button>
    <p class="fine">전송 중에는 버튼이 잠겨 두 번 접수되지 않습니다</p>
  </form>

  <section class="done" id="done" hidden aria-live="polite">
    <div class="done-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1E6A4C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
    </div>
    <h2 id="doneTitle">상담 신청이 접수되었습니다</h2>
    <p id="doneBody">빈방과 입실 가능일을 확인해 남겨주신 번호로 연락드리겠습니다.</p>
    <div class="box">· 영업시간 외 접수는 다음 날 오전에 연락드립니다<br>· 급하시면 아래 카톡으로 남겨주세요</div>
    <a class="btn kakao" href="#" data-k="linkKakao">카카오톡으로 문의하기</a>
    <a href="/">홈으로</a>
  </section>

</div>
<script src="/app.js" defer></script>
</body>
</html>
